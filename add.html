<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Medicine - Smart Pillbox</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav class="navbar">
    <h1>Smart Pillbox</h1>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="add.html" class="active">Add Medicine</a></li>
      <li><a href="reminders.html">Reminders</a></li>
      <li><a href="about.html">About</a></li>
    </ul>
  </nav>

  <section class="home">
    <div class="container">
      <h2>Add Your Medicine 💊</h2>
      <p>Enter the medicine name and time to set a reminder.</p>

      <form id="medicineForm" class="input-card">
        <input type="text" id="medicineName" placeholder="Enter medicine name" class="input-style" required>
        <input type="time" id="medicineTime" class="input-style" required>
        <button type="submit" class="add-btn">Add Medicine</button>
      </form>

      <p id="message" style="color: green; font-weight: bold; margin-top: 1rem;"></p>

      <a href="reminders.html" class="btn" style="margin-top: 1rem; display: inline-block;">View All Reminders</a>
    </div>
  </section>

  <footer>
    <p>© 2026 Smart Pill Reminder | Community Engagement Project</p>
  </footer>

  <script>
    document.getElementById("medicineForm").addEventListener("submit", function(e) {
      e.preventDefault(); // This stops the page from refreshing or looking for a server

      const name = document.getElementById("medicineName").value.trim();
      const time = document.getElementById("medicineTime").value;

      if (name && time) {
        // Save to the browser's local storage
        const meds = JSON.parse(localStorage.getItem("medicines")) || [];
        meds.push({ name, time });
        localStorage.setItem("medicines", JSON.stringify(meds));

        // Show confirmation
        const message = document.getElementById("message");
        message.textContent = "✅ Medicine added successfully!";
        
        // Reset the form
        document.getElementById("medicineForm").reset();

        // Clear message after 3 seconds
        setTimeout(() => {
          message.textContent = "";
        }, 3000);
      }
    });
  </script>
</body>
</html>
