<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Medicine - Smart Pillbox</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav class="navbar">
    <h1>Smart Pillbox</h1>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="add.html" class="active">Add Medicine</a></li>
      <li><a href="reminders.html">Reminders</a></li>
      <li><a href="about.html">About</a></li>
    </ul>
  </nav>

  <section class="home">
    <div class="container">
      <h2>Add Your Medicine 💊</h2>
      <p>Enter the medicine name and time to set a reminder.</p>

      <form id="medicineForm" class="input-card">
        <div class="input-group">
          <input type="text" id="medicineName" placeholder="Enter medicine name" class="input-style" required>
        </div>
        
        <div class="input-group">
          <input type="time" id="medicineTime" class="input-style" required>
        </div>
        
        <button type="submit" class="add-btn">Add Medicine</button>
      </form>

      <p id="message" style="color: #28a745; font-weight: bold; margin-top: 15px;"></p>

      <a href="reminders.html" class="btn-link" style="margin-top: 1.5rem; display: inline-block;">View All Reminders</a>
    </div>
  </section>

  <footer>
    <p>© 2026 Smart Pill Reminder | Community Engagement Project</p>
  </footer>

  <script>
    document.getElementById("medicineForm").addEventListener("submit", function(e) {
      // CRITICAL: This line stops the 405 Not Allowed error by preventing 
      // the browser from trying to find a backend server.
      e.preventDefault();

      const name = document.getElementById("medicineName").value.trim();
      const time = document.getElementById("medicineTime").value;

      if (name && time) {
        // 1. Save to LocalStorage (This works on GitHub Pages/Browsers)
        const meds = JSON.parse(localStorage.getItem("medicines")) || [];
        meds.push({ name, time });
        localStorage.setItem("medicines", JSON.stringify(meds));

        // 2. Visual feedback
        const messageEl = document.getElementById("message");
        messageEl.textContent = "✅ " + name + " added successfully!";
        
        // 3. Clear the form for the next entry
        document.getElementById("medicineForm").reset();

        // Optional: Hide message after 3 seconds
        setTimeout(() => { messageEl.textContent = ""; }, 3000);
      }
    });
  </script>
</body>
</html>
