<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Medicine - Smart Pillbox</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav class="navbar">
    <h1>Smart Pillbox</h1>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="add.html" class="active">Add Medicine</a></li>
      <li><a href="reminders.html">Reminders</a></li>
      <li><a href="about.html">About</a></li>
    </ul>
  </nav>

  <section class="home">
    <h2>Add Your Medicine 💊</h2>
    <p>Enter the medicine name and time to set a reminder.</p>

<form id="medicineForm" class="input-card">
  <input type="text" id="medicineName" placeholder="Enter medicine name" class="input-style" required>
  <input type="time" id="medicineTime" class="input-style" required>
  <button type="submit" class="add-btn">Add Medicine</button>
</form>

    <p id="message" style="color: green; font-weight: bold; margin-top: 10px;"></p>

    <a href="reminders.html" class="btn" style="margin-top: 1rem;">View All Reminders</a>
  </section>

  <footer>
    <p>© 2025 Smart Pill Reminder | Community Engagement Project</p>
  </footer>

 <script>
  document.getElementById("medicineForm").addEventListener("submit", function(e) {
    // This line is the most important! It stops the browser from reloading/405 error
    e.preventDefault(); 

    const name = document.getElementById("medicineName").value.trim();
    const time = document.getElementById("medicineTime").value;

    if (name && time) {
      // Save data to the browser's memory (LocalStorage)
      const meds = JSON.parse(localStorage.getItem("medicines")) || [];
      meds.push({ name, time });
      localStorage.setItem("medicines", JSON.stringify(meds));

      // Show success and clear form
      document.getElementById("message").textContent = "✅ Medicine added successfully!";
      document.getElementById("medicineForm").reset();
    }
  });
</script>
</body>
</html>
